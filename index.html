<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedTube</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-left">
      <div class="logo" id="logo">
        <div class="logo-icon"></div>
        <div class="logo-text">Speed<span>Tube</span></div>
      </div>
    </div>
    <div class="navbar-center">
      <form class="search-form" id="search-form">
        <input type="text" class="search-input" id="search-input" placeholder="Search videos..." autocomplete="off">
        <button type="submit" class="search-btn">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
    </div>
  </nav>

  <!-- Persistent Player Container (Hidden by default) -->
  <div id="persistent-player-wrapper" style="display:none;">
    <div class="video-player">
      <div id="yt-player"></div>
    </div>
  </div>

  <main class="main-content full-width" id="main-content">
    <div id="content-area"></div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
